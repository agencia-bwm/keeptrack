heroEyebrow: Treinamentos e expedições 4x4
heroTitulo: Off-road com quem leva segurança a sério
heroSubtitulo: Treinamentos de condução 4x4 e expedições guiadas pelo Brasil e pela América do Sul. Você aprende a usar tudo o que o seu 4x4 oferece e volta para casa com o carro, os passageiros e a história inteiros.
heroImagem: /src/assets/uploads/fotos/canastra/4runner-pedras.jpg
heroImagemAlt: Toyota 4Runner equipada vencendo trecho de pedras na Serra da Canastra
heroFotos:
  - imagem: /src/assets/uploads/fotos/canastra/travessia-rio.jpg
    alt: Hilux da KeepTrack atravessando um rio raso na Serra da Canastra
  - imagem: /src/assets/uploads/fotos/canastra/hilux-trilha.jpg
    alt: Hilux de apoio da KeepTrack com rack e snorkel em estrada de terra na Serra da Canastra
    posicao: 50% 55%
  - imagem: /src/assets/uploads/fotos/jalapao/comboio.jpg
    alt: Comboio de carros 4x4 da expedição parado em estrada de terra no Jalapão
# Números de autoridade — confirmar com o Caio antes do lançamento
numeros:
  - valor: "10+"
    rotulo: destinos percorridos em expedições
  - valor: "13"
    rotulo: turmas de treinamento em 2026
  - valor: "6 h"
    rotulo: de treinamento, metade em pista off-road
  - valor: "BR + AS"
    rotulo: roteiros pelo Brasil e América do Sul
pilares:
  - titulo: Técnica antes da aventura
    texto: Todo participante sai do treinamento sabendo usar tração, reduzida e bloqueios, e ler o terreno antes de entrar nele.
  - titulo: Apoio em cada quilômetro
    texto: Rádio, guincho, hi-lift, compressor e kit de resgate acompanham o comboio. Se alguém atolar, a equipe resolve.
  - titulo: Roteiro testado
    texto: Os trajetos são percorridos e planejados com antecedência, com pontos de parada, hospedagem e plano B definidos.
