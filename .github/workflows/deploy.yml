name: Build e deploy (Hostinger)

on:
  push:
    branches: [main, staging]
  schedule:
    - cron: '0 6 * * *' # 03h em Brasília: tira turmas e viagens vencidas das listas
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # para salvar a reorganização das expedições (painéis)
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Organizar expedições (próximas → realizadas)
        id: organizar
        run: node scripts/organizar-viagens.mjs
      - name: Validar campos (schemas)
        run: npx astro check
      - name: Build
        run: npm run build
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.0 autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      - name: Salvar expedições reorganizadas no repositório
        if: steps.organizar.outputs.mudou == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true # se a branch for protegida, o site publica igual; só o painel não reorganiza
        run: |
          git config user.name "keeptrack-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/content/viagens
          git commit -m "Painel: move expedições terminadas para Realizadas"
          git push
      - uses: actions/upload-artifact@v4.5.0
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    # Desligado até o lançamento: o envio para a Hostinger substitui o site atual
    # (rsync --delete). Para ligar: Settings → Secrets and variables → Actions →
    # Variables → New variable  DEPLOY_HOSTINGER = true  (e cadastrar os secrets SSH).
    if: vars.DEPLOY_HOSTINGER == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ github.ref == 'refs/heads/main' && 'producao' || 'homologacao' }}
    steps:
      - uses: actions/download-artifact@v4.1.8
        with:
          name: dist
          path: dist
      - name: Homologação sem indexação
        if: github.ref == 'refs/heads/staging'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          cat >> dist/.htaccess <<'HT'
          Header always set X-Robots-Tag "noindex, nofollow"
          AuthType Basic
          AuthName "Homologacao KeepTrack"
          AuthUserFile ${{ secrets.HTPASSWD_PATH }}
          Require valid-user
          HT
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
      - name: rsync para a Hostinger
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}"
